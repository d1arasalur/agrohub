{% extends 'base.html' %}
{% block title %}LiveMandi — Market Prices{% endblock %}
{% block content %}
<div class="page-hero">
  <span class="page-hero-icon">📊</span>
  <h1 data-en="LiveMandi — Market Prices" data-ta="LiveMandi — சந்தை விலை">LiveMandi — Market Prices</h1>
  <p data-en="Real-time wholesale prices from Tamil Nadu mandis" data-ta="தமிழ்நாடு சந்தைகளில் இருந்து நேரலை மொத்த விலைகள்">Real-time wholesale prices from Tamil Nadu mandis</p>
</div>
<section class="section">
  <div class="container">
    <div class="mandi-controls">
      <select class="fi" id="mandiDist" onchange="loadMandi()" style="max-width:220px">
        <option value="Salem">Salem / சேலம்</option>
        <option value="Coimbatore">Coimbatore / கோயம்புத்தூர்</option>
        <option value="Madurai">Madurai / மதுரை</option>
        <option value="Erode">Erode / ஈரோடு</option>
        <option value="Trichy">Trichy / திருச்சி</option>
      </select>
      <span id="mandiDate" style="color:var(--text-light);font-size:0.85rem"></span>
      <button class="btn btnO btnSm" onclick="loadMandi()">🔄 <span data-en="Refresh" data-ta="புதுப்பிக்க">Refresh</span></button>
    </div>
    <div class="mandi-table-wrap card" style="padding:0;overflow:hidden;margin-bottom:32px">
      <table class="mandi-table" id="mandiTable">
        <thead><tr>
          <th data-en="Crop" data-ta="பயிர்">Crop</th>
          <th data-en="Min ₹/kg" data-ta="குறைந்த ₹/kg">Min ₹/kg</th>
          <th data-en="Max ₹/kg" data-ta="அதிக ₹/kg">Max ₹/kg</th>
          <th data-en="Avg ₹/kg" data-ta="சராசரி ₹/kg">Avg ₹/kg</th>
          <th data-en="Change" data-ta="மாற்றம்">Change</th>
        </tr></thead>
        <tbody id="mandiBody"></tbody>
      </table>
    </div>
    <div class="card">
      <h3 style="margin-bottom:16px" data-en="7-Day Price Chart" data-ta="7 நாள் விலை வரைபடம்">7-Day Price Chart</h3>
      <canvas id="priceCanvas" height="80"></canvas>
    </div>
  </div>
</section>
{% endblock %}
