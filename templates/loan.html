{% extends 'base.html' %}
{% block title %}FarmLoan Portal{% endblock %}
{% block content %}
<div class="page-hero">
  <span class="page-hero-icon">🏦</span>
  <h1 data-en="FarmLoan Portal" data-ta="FarmLoan தளம்">FarmLoan Portal</h1>
  <p data-en="Government schemes, subsidies & bank loans for farmers" data-ta="விவசாயிகளுக்கான அரசு திட்டங்கள், மானியங்கள் & வங்கி கடன்கள்">Government schemes, subsidies & bank loans for farmers</p>
</div>
<section class="section">
  <div class="container">
    <div class="tab-nav">
      <button class="tab on" onclick="showLoanTab('schemes',this)" data-en="Schemes" data-ta="திட்டங்கள்">Schemes</button>
      <button class="tab" onclick="showLoanTab('calculator',this)" data-en="EMI Calculator" data-ta="EMI கணக்கீடு">EMI Calculator</button>
      <button class="tab" onclick="showLoanTab('eligibility',this)" data-en="Eligibility" data-ta="தகுதி சரிபார்ப்பு">Eligibility</button>
    </div>
    <div id="tab-schemes" class="tab-content">
      <div class="ga" id="schemesGrid"></div>
    </div>
    <div id="tab-calculator" class="tab-content" style="display:none">
      <div class="card" style="max-width:500px;margin:0 auto">
        <h3 style="margin-bottom:20px" data-en="Loan EMI Calculator" data-ta="கடன் EMI கணக்கீடு">Loan EMI Calculator</h3>
        <div class="fg"><label data-en="Loan Amount (₹)" data-ta="கடன் தொகை (₹)">Loan Amount (₹)</label><input type="number" id="lAmt" class="fi" placeholder="100000" oninput="calcEMI()"/></div>
        <div class="fg"><label data-en="Interest Rate (% per year)" data-ta="வட்டி விகிதம் (% ஆண்டு)">Interest Rate (% per year)</label><input type="number" id="lRate" class="fi" placeholder="7" step="0.1" oninput="calcEMI()"/></div>
        <div class="fg"><label data-en="Tenure (months)" data-ta="காலம் (மாதங்கள்)">Tenure (months)</label><input type="number" id="lTenure" class="fi" placeholder="60" oninput="calcEMI()"/></div>
        <div class="emi-result" id="emiResult">
          <div class="emi-row"><span data-en="Monthly EMI" data-ta="மாதாந்திர தவணை">Monthly EMI</span><strong id="emiVal">₹ --</strong></div>
          <div class="emi-row"><span data-en="Total Interest" data-ta="மொத்த வட்டி">Total Interest</span><strong id="totalInt">₹ --</strong></div>
          <div class="emi-row"><span data-en="Total Payment" data-ta="மொத்த கட்டணம்">Total Payment</span><strong id="totalPay">₹ --</strong></div>
        </div>
      </div>
    </div>
    <div id="tab-eligibility" class="tab-content" style="display:none">
      <div class="card" style="max-width:560px;margin:0 auto">
        <h3 style="margin-bottom:20px" data-en="Check Your Eligibility" data-ta="உங்கள் தகுதி சரிபார்க்கவும்">Check Your Eligibility</h3>
        <form onsubmit="checkElig(event)">
          <div class="form-row">
            <div class="fg"><label data-en="Age" data-ta="வயது">Age</label><input type="number" id="eAge" class="fi" required/></div>
            <div class="fg"><label data-en="Land (acres)" data-ta="நிலம் (ஏக்கர்)">Land (acres)</label><input type="number" id="eLand" class="fi" step="0.1" required/></div>
          </div>
          <div class="fg"><label data-en="Annual Income (₹)" data-ta="ஆண்டு வருமானம் (₹)">Annual Income (₹)</label><input type="number" id="eIncome" class="fi" required/></div>
          <div class="fg"><label data-en="Scheme Type" data-ta="திட்ட வகை">Scheme Type</label>
            <select id="eScheme" class="fi">
              <option value="kcc">Kisan Credit Card (KCC)</option>
              <option value="pm_kisan">PM-Kisan</option>
              <option value="fasal">Fasal Bima (Crop Insurance)</option>
            </select>
          </div>
          <button type="submit" class="btn btnP btnFull" data-en="Check Eligibility" data-ta="தகுதி பார்க்க">Check Eligibility</button>
        </form>
        <div id="eligResult" style="display:none;margin-top:20px"></div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
